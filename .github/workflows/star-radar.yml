name: star-radar

on:
  schedule:
    # 周一 07:07 Asia/Shanghai（= 周日 23:07 UTC），给下游 08:50 的简报留出余量
    - cron: "7 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_USER: dengshu2
          WINDOW_DAYS: "7"
        run: python scripts/collect_stars.py > stars.json

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "stars: $(date -u +%Y-%m-%d)"
            git push
          fi
